<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Planer</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- STARTSEITE -->
<section id="homeScreen" class="screen active">

  <main class="home">
    <h1>PLANER</h1>

    <button id="plansButton">Pläne</button>
    <button id="startButton">Start</button>
  </main>

</section>

<!-- START-ÜBERSICHT -->
<section id="startOverviewScreen" class="screen">

  <header class="topbar">
    <button id="backFromStartOverview" class="icon-button">‹</button>

    <h2 id="startPlanTitle">Plan</h2>

    <div class="icon-placeholder"></div>
  </header>

  <main class="start-overview-content">

    <div id="noActivePlanMessage" class="empty-message">
      Kein aktiver Plan.
      <br><br>
      Wähle unter „Pläne“ einen Plan mit dem Herz aus.
    </div>

    <div id="activePlanOverview">

      <div id="startPlanItems"></div>

      <div class="total-row">
        <span>Gesamtdauer</span>
        <span id="totalPlanDuration"></span>
      </div>

      <button id="goButton" class="go-button">
        LOS
      </button>

    </div>

  </main>

</section>


<!-- PLANLISTE -->
<section id="plansScreen" class="screen">

  <header class="topbar">
    <button id="backFromPlans" class="icon-button">‹</button>

    <h2>Pläne</h2>

    <button id="addPlanButton" class="icon-button">+</button>
  </header>

  <main class="content">

    <div id="emptyPlansMessage" class="empty-message">
      Noch keine Pläne vorhanden.
    </div>

    <div id="plansList"></div>

  </main>

</section>


<!-- NAME FÜR NEUEN PLAN -->
<section id="newPlanScreen" class="screen">

  <header class="topbar">
    <button id="backFromNewPlan" class="icon-button">‹</button>

    <h2>Neuer Plan</h2>

    <div class="icon-placeholder"></div>
  </header>

  <main class="new-plan-content">

    <label for="planName">Name</label>

    <input
            id="planName"
            type="text"
            placeholder="z.B. Physiktag"
            autocomplete="off"
    >

    <button id="createPlanButton" class="primary-button">
      Weiter
    </button>

  </main>

</section>


<!-- PLAN EDITOR -->
<section id="planEditorScreen" class="screen">

  <header class="topbar">
    <button id="backFromEditor" class="icon-button">‹</button>

    <h2 id="editorPlanTitle">Plan</h2>

    <div class="icon-placeholder"></div>
  </header>

  <main class="editor-content">

    <div class="editor-name-group">
      <label for="editorPlanName">Name</label>

      <input
              id="editorPlanName"
              type="text"
              autocomplete="off"
      >
    </div>

    <div id="planItems"></div>

    <div id="emptyPlanMessage" class="empty-message">
      Dieser Plan ist noch leer.
    </div>

    <div class="editor-buttons">

      <button id="addTaskButton" class="secondary-button">
        + Aufgabe
      </button>

      <button id="addBreakButton" class="secondary-button">
        + Pause
      </button>

    </div>

    <button id="savePlanButton" class="primary-button">
      Plan speichern
    </button>

    <button id="deletePlanButton" class="danger-button">
      Plan löschen
    </button>

  </main>

</section>


<!-- AUFGABE HINZUFÜGEN -->
<section id="taskScreen" class="screen">

  <header class="topbar">
    <button id="backFromTask" class="icon-button">‹</button>

    <h2>Aufgabe</h2>

    <div class="icon-placeholder"></div>
  </header>

  <main class="form-content">

    <label for="taskName">Name</label>

    <input
            id="taskName"
            type="text"
            placeholder="z.B. Klavier"
    >


    <label for="taskDuration">Dauer in Minuten</label>

    <input
            id="taskDuration"
            type="number"
            min="1"
            inputmode="numeric"
            placeholder="40"
    >


    <label for="taskNote">Notiz</label>

    <textarea
            id="taskNote"
            placeholder="Optional..."
    ></textarea>


    <button id="saveTaskButton" class="primary-button">
      Hinzufügen
    </button>

  </main>

</section>


<!-- PAUSE HINZUFÜGEN -->
<section id="breakScreen" class="screen">

  <header class="topbar">
    <button id="backFromBreak" class="icon-button">‹</button>

    <h2>Pause</h2>

    <div class="icon-placeholder"></div>
  </header>

  <main class="form-content">

    <label for="breakDuration">Dauer in Minuten</label>

    <input
            id="breakDuration"
            type="number"
            min="1"
            inputmode="numeric"
            placeholder="20"
    >

    <button id="saveBreakButton" class="primary-button">
      Hinzufügen
    </button>

  </main>

</section>

<!-- LAUFENDER PLAN -->
<!-- LAUFENDER PLAN -->
<section id="sessionScreen" class="screen">

  <main class="session-content">

    <div id="sessionType" class="session-type">
      Aufgabe
    </div>

    <h1 id="sessionTitle">
      Klavier
    </h1>

    <div id="sessionProgress" class="session-progress">
      1 von 4
    </div>


    <!-- UMDREHBARE KARTE -->
    <div id="sessionCard" class="session-card">

      <div class="session-card-inner">

        <!-- VORDERSEITE -->
        <div class="session-face session-front">

          <svg
                  class="hourglass-svg"
                  viewBox="0 0 200 260"
                  aria-label="Sanduhr"
          >

            <defs>

              <clipPath id="topGlassClip">
                <polygon
                        points="
                                        35,35
                                        165,35
                                        110,125
                                        90,125
                                    "
                />
              </clipPath>

              <clipPath id="bottomGlassClip">
                <polygon
                        points="
                                        90,135
                                        110,135
                                        165,225
                                        35,225
                                    "
                />
              </clipPath>

            </defs>


            <!-- SAND OBEN -->
            <rect
                    id="topSand"
                    class="sand"
                    x="35"
                    y="35"
                    width="130"
                    height="90"
                    clip-path="url(#topGlassClip)"
            />


            <!-- SAND UNTEN -->
            <rect
                    id="bottomSand"
                    class="sand"
                    x="35"
                    y="225"
                    width="130"
                    height="0"
                    clip-path="url(#bottomGlassClip)"
            />


            <!-- FALLENDER SAND -->
            <line
                    id="sandStream"
                    class="sand-stream"
                    x1="100"
                    y1="123"
                    x2="100"
                    y2="138"
            />


            <!-- GLAS -->
            <polygon
                    class="glass-outline"
                    points="
                                35,35
                                165,35
                                110,125
                                90,125
                            "
            />

            <polygon
                    class="glass-outline"
                    points="
                                90,135
                                110,135
                                165,225
                                35,225
                            "
            />


            <!-- HOLZ / RAHMEN -->
            <line
                    class="hourglass-frame"
                    x1="25"
                    y1="27"
                    x2="175"
                    y2="27"
            />

            <line
                    class="hourglass-frame"
                    x1="25"
                    y1="233"
                    x2="175"
                    y2="233"
            />

            <line
                    class="hourglass-frame-side"
                    x1="35"
                    y1="30"
                    x2="35"
                    y2="230"
            />

            <line
                    class="hourglass-frame-side"
                    x1="165"
                    y1="30"
                    x2="165"
                    y2="230"
            />

          </svg>


          <div
                  id="sessionTimer"
                  class="session-timer"
          >
            40:00
          </div>


          <div
                  id="sessionFlipHint"
                  class="flip-hint"
          >
            Tippen für Notiz
          </div>

        </div>


        <!-- RÜCKSEITE -->
        <div class="session-face session-back">

          <div class="note-label">
            NOTIZ
          </div>

          <div
                  id="sessionNote"
                  class="session-note"
          >
          </div>

          <div class="flip-hint">
            Tippen zum Zurückkehren
          </div>

        </div>

      </div>

    </div>

  </main>

</section>


<script src="app.js"></script>

</body>
</html>
