name: Build Planer v67 package
on:
  push:
    branches:
      - v66-input-freeze-fix
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create v67 files and patch index
        shell: bash
        env:
          V67_JS_GZ_B64: 
          V67_CSS_GZ_B64: 
        run: |
          printf '%s' "$V67_JS_GZ_B64" | base64 -d | gzip -d > v67.js
          printf '%s' "$V67_CSS_GZ_B64" | base64 -d | gzip -d > v67.css
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<script src="v65.js?v=66" defer></script>'
          addition = marker + '\n    <link rel="stylesheet" href="v67.css?v=67">\n    <script src="v67.js?v=67" defer></script>'
          if 'v67.js?v=67' not in text:
              if marker not in text:
                  raise SystemExit('v65.js?v=66 marker not found')
              text = text.replace(marker, addition, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Validate v67
        shell: bash
        run: |
          node --check v67.js
          grep -q 'v67.js?v=67' index.html
          grep -q 'v67.css?v=67' index.html
          grep -q 'universeCanvas.click()' v67.js
          grep -q 'fullEditorFinish.click()' v67.js
          grep -q '#sessionBack #sessionTimer' v67.css
          grep -q '#fullTextEditorScreen #finishFullTextEditorButton' v67.css
      - name: Package changed files
        run: zip -j Planer_v67_changed_files.zip index.html v67.js v67.css
      - uses: actions/upload-artifact@v4
        with:
          name: Planer-v67-changed-files
          path: Planer_v67_changed_files.zip
          retention-days: 1
