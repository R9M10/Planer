name: Build Planer v65 package
on:
  push:
    branches:
      - calendar-focus-v64
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create v65 files and patch index
        shell: bash
        env:
          V65_JS_GZ_B64: 
          V65_CSS_GZ_B64: 
        run: |
          printf '%s' "$V65_JS_GZ_B64" | base64 -d | gzip -d > v65.js
          printf '%s' "$V65_CSS_GZ_B64" | base64 -d | gzip -d > v65.css
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<script src="app.js?v=64" defer></script>'
          addition = marker + '\n    <link rel="stylesheet" href="v65.css?v=65">\n    <script src="v65.js?v=65" defer></script>'
          if 'v65.js?v=65' not in text:
              if marker not in text:
                  raise SystemExit('app.js v64 marker not found')
              text = text.replace(marker, addition, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Validate package
        shell: bash
        run: |
          node --check v65.js
          grep -q 'id="focusSearchInput"' index.html
          grep -q 'id="openFilmsButton"' index.html
          grep -q 'id="filmRoomCameraHotspot"' index.html
          grep -q 'id="plannerPlansButton"' index.html
          grep -q 'id="plannerBlackHoleHotspot"' index.html
          grep -q 'id="sessionFront"' index.html
          grep -q 'id="sessionTimer"' index.html
          grep -q 'v65.js?v=65' index.html
          grep -q 'v65.css?v=65' index.html
      - name: Package changed files
        run: zip -j Planer_v65_changed_files.zip index.html v65.js v65.css
      - uses: actions/upload-artifact@v4
        with:
          name: Planer-v65-changed-files
          path: Planer_v65_changed_files.zip
          retention-days: 1
