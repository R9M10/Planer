name: Calendar Focus v64 Patch

on:
  push:
    branches:
      - calendar-focus-v64

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: calendar-focus-v64
          fetch-depth: 0

      - name: Patch calendar into focus mode
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path("app.js")
          index_path = Path("index.html")

          app = app_path.read_text(encoding="utf-8")
          index = index_path.read_text(encoding="utf-8")

          focus_start = app.index("const FOCUS_APPLICATIONS = [")
          focus_end = app.index("\n    ];", focus_start)
          before = app[:focus_start]
          focus = app[focus_start:focus_end]
          after = app[focus_end:]

          if 'id: "calendar"' not in focus:
              focus = focus.replace(
                  '"todo", "to do", "kalender", "zeit", "session", "lernen", "arbeit"',
                  '"todo", "to do", "zeit", "session", "lernen", "arbeit"',
                  1,
              )

              books_anchor = '''        {
                      id: "books",
                      name: "Bücher",'''
              if books_anchor not in focus:
                  raise SystemExit("Books anchor in FOCUS_APPLICATIONS not found")

              calendar_entry = '''        {
                      id: "calendar",
                      name: "Kalender",
                      hint: "Termine · Studium",
                      aliases: [
                          "kalender", "calendar", "termin", "termine", "agenda", "woche", "monat",
                          "wochenplan", "deadline", "deadlines", "prüfung", "prüfungen",
                          "vorlesung", "vorlesungen"
                      ]
                  },
          '''
              focus = focus.replace(books_anchor, calendar_entry + books_anchor, 1)

          app = before + focus + after

          switch_start = app.index("function openFocusApplication(")
          switch_end = app.index("focusSearchInput.addEventListener", switch_start)
          switch_block = app[switch_start:switch_end]

          if 'case "calendar":' not in switch_block:
              planner_case = '''            case "planner":
                          showScreen(screens.plannerHub);
                          break;
          '''
              if planner_case not in switch_block:
                  raise SystemExit("Planner case anchor not found")

              calendar_case = '''            case "calendar":
                          window.location.href = "calendar.html";
                          break;
          '''
              switch_block = switch_block.replace(
                  planner_case,
                  planner_case + calendar_case,
                  1,
              )
              app = app[:switch_start] + switch_block + app[switch_end:]

          if 'app.js?v=62' in index:
              index = index.replace('app.js?v=62', 'app.js?v=64', 1)
          elif 'app.js?v=64' not in index:
              raise SystemExit("app.js version anchor not found in index.html")

          if 'id: "calendar"' not in app:
              raise SystemExit("Calendar focus application was not inserted")
          if 'case "calendar":' not in app:
              raise SystemExit("Calendar focus navigation was not inserted")
          if 'app.js?v=64' not in index:
              raise SystemExit("Cache-bust was not updated")

          app_path.write_text(app, encoding="utf-8")
          index_path.write_text(index, encoding="utf-8")
          PY

          rm -f .github/workflows/calendar-focus-v64.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app.js index.html .github/workflows/calendar-focus-v64.yml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Integrate calendar into focus mode"
          git push origin HEAD:calendar-focus-v64
