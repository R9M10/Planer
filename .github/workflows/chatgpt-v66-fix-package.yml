name: Build Planer v66 input fix
on:
  push:
    branches:
      - v66-input-freeze-fix
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch focus search loop
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          js_path = Path('v65.js')
          index_path = Path('index.html')
          js = js_path.read_text(encoding='utf-8')
          index = index_path.read_text(encoding='utf-8')

          pattern = re.compile(
              r'\n\s*if \(focusSuggestions\) \{\s*'
              r'new MutationObserver\(\(\) => \{\s*'
              r'if \(!augmentingFocus\) queueMicrotask\(augmentFocus\);\s*'
              r'\}\)\.observe\(focusSuggestions, \{ childList: true \}\);\s*'
              r'\}\s*\n\s*'
              r'focusInput\?\.addEventListener\("input", \(\) => setTimeout\(augmentFocus, 0\)\);\s*\n\s*'
              r'focusInput\?\.addEventListener\("focus", \(\) => setTimeout\(augmentFocus, 0\)\);'
          )

          replacement = '''

          // Do not observe focusSuggestions itself here. augmentFocus mutates that
          // element, so observing it creates a self-triggering microtask loop on iOS.
          // The native search renders synchronously before these listeners run.
          focusInput?.addEventListener("input", () => setTimeout(augmentFocus, 0));
          focusInput?.addEventListener("focus", () => setTimeout(augmentFocus, 0));
          focusInput?.addEventListener("keydown", event => {
              if (["ArrowUp", "ArrowDown", "Home", "End"].includes(event.key)) {
                  setTimeout(augmentFocus, 0);
              }
          });'''

          js, count = pattern.subn(replacement, js, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one focus observer block, found {count}')

          if 'v65.js?v=65' not in index:
              raise SystemExit('Expected v65 script cache key not found')
          index = index.replace('v65.js?v=65', 'v65.js?v=66', 1)

          js_path.write_text(js, encoding='utf-8')
          index_path.write_text(index, encoding='utf-8')
          PY
      - name: Validate fix
        shell: bash
        run: |
          node --check v65.js
          ! grep -q 'observe(focusSuggestions' v65.js
          ! grep -q 'queueMicrotask(augmentFocus)' v65.js
          grep -q 'v65.js?v=66' index.html
          grep -q 'focusInput?.addEventListener("input"' v65.js
          grep -q 'ArrowDown' v65.js
          grep -q 'id="focusSearchInput"' index.html
          grep -q 'id="openFilmsButton"' index.html
          grep -q 'v65.css?v=65' index.html
      - name: Package only changed files
        run: zip -j Planer_v66_input_fix.zip index.html v65.js
      - uses: actions/upload-artifact@v4
        with:
          name: Planer-v66-input-fix
          path: Planer_v66_input_fix.zip
          retention-days: 1
